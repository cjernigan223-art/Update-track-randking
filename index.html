<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Championship Rankings | Track & Field</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        :root {
            --primary-blue: #001d3d;
            --accent-yellow: #ffc300;
            --white: #ffffff;
            --gray: #e5e5e5;
        }

        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--gray);
            color: var(--primary-blue);
        }

        /* ESPN Header Style */
        header {
            background-color: var(--primary-blue);
            color: var(--white);
            padding: 20px 0;
            text-align: center;
            border-bottom: 5px solid var(--accent-yellow);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        header h1 {
            margin: 0;
            font-family: 'Oswald', sans-serif;
            font-size: 3rem;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: var(--white);
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .card-header {
            background: var(--primary-blue);
            color: var(--accent-yellow);
            padding: 15px 20px;
            font-family: 'Oswald', sans-serif;
            font-size: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Table Styling */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background-color: #f8f9fa;
        }

        th {
            padding: 15px;
            text-align: left;
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            border-bottom: 2px solid var(--gray);
        }

        td {
            padding: 15px;
            border-bottom: 1px solid var(--gray);
            font-size: 1.1rem;
        }

        /* Rank Column Highlight */
        .rank-col {
            font-weight: bold;
            color: var(--primary-blue);
            width: 60px;
            text-align: center;
        }

        .points-col {
            font-weight: bold;
            color: #d00000; /* Red for points visibility */
            text-align: right;
        }

        tr:hover {
            background-color: rgba(255, 195, 0, 0.1);
        }

        .footer {
            text-align: center;
            margin-top: 50px;
            font-size: 0.9rem;
            color: #666;
            padding-bottom: 40px;
        }
    </style>
</head>
<body>

<header>
    <h1>National Track Rankings</h1>
</header>

<div class="container">
    <div class="card">
        <div class="card-header">
            <span>STATE TEAM LEADERBOARD</span>
            <span style="font-size: 0.8rem; color: white;">LIVE UPDATES</span>
        </div>
        <table id="rankings-table">
            <thead>
                <tr>
                    <th style="text-align: center;">RK</th>
                    <th>SCHOOL / CLUB</th>
                    <th style="text-align: right;">PTS</th>
                </tr>
            </thead>
            <tbody>
                </tbody>
        </table>
    </div>

    <div class="footer">
        Data automatically updated via GitHub Actions.
    </div>
</div>

<script>
    // Pull the CSV generated by your Python scraper
    Papa.parse("national_v1_team_rankings.csv", {
        download: true,
        header: true,
        complete: function(results) {
            const tbody = document.querySelector("#rankings-table tbody");
            results.data.forEach((row, index) => {
                if(row.School) {
                    let tr = `
                        <tr>
                            <td class="rank-col">${row.Rank || (index + 1)}</td>
                            <td style="font-weight: 700;">${row.School.toUpperCase()}</td>
                            <td class="points-col">${row.Points}</td>
                        </tr>
                    `;
                    tbody.innerHTML += tr;
                }
            });
        }
    });
</script>

</body>
</html>
